name: Update football model
on:
  schedule:
    - cron: '25 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: football-model-publish
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r football-model/requirements.txt
      - name: Refresh results and publish model forecasts
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          OPENBLAS_NUM_THREADS: '1'
        run: python football-model/export.py --refresh
      - name: Verify model snapshot
        run: python -m unittest discover -s football-model -p 'test_*.py'
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/football/model.json football-model/model.json football-model/games.json.gz
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh football model rankings and game forecasts'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
